name: Daily Soccer Predictions + Results

on:
  schedule:
    - cron: "0 1 * * *"   # 4:00 AM EAT: daily predictions
    - cron: "0 20 * * *"  # 11:00 PM EAT: settle recent results
    - cron: "0 3 * * 1"   # 6:00 AM EAT Mondays: weekly report
    - cron: "0 3 1 * *"   # 6:00 AM EAT on the 1st: monthly report
  workflow_dispatch:
    inputs:
      mode:
        description: "What should this manual run do?"
        required: true
        default: "results"
        type: choice
        options:
          - results
          - predictions
          - weekly
          - monthly
          - all
      days_back:
        description: "Number of past days to fetch results for"
        required: false
        default: "3"
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

permissions:
  contents: write

jobs:
  fetch-results:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 20 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'results' || github.event.inputs.mode == 'all'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch and settle match results
        run: |
          DAYS="${{ github.event.inputs.days_back || '3' }}"
          python fetch_results.py --days "$DAYS" 2>&1 | tee fetch_output.txt
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}

      - name: Upload fetch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-logs-${{ github.run_id }}
          path: fetch_output.txt

      - name: Send Telegram results summary
        if: always()
        run: |
          python - <<'PY'
          import os
          import re
          import requests

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          chats = [os.getenv("TELEGRAM_CHAT_ID"), os.getenv("TELEGRAM_VIP_CHAT_ID")]
          days = os.getenv("DAYS_BACK", "3")

          if not token or not any(chats):
              print("Skipping Telegram results summary: missing bot token or chat id.")
              raise SystemExit(0)

          try:
              with open("fetch_output.txt", "r", encoding="utf-8", errors="replace") as f:
                  output = f.read()
          except FileNotFoundError:
              output = ""

          summary_match = re.search(r"SUMMARY:\s*(.+)", output)
          unmatched_match = re.search(r"Unmatched:\s*(\d+)", output)
          updated_match = re.search(r"Updated\s+(\d+)\s+predictions", output)

          summary = summary_match.group(1).strip() if summary_match else "Results fetch completed."
          updated = updated_match.group(1) if updated_match else "0"
          unmatched = unmatched_match.group(1) if unmatched_match else "0"

          message = (
              "RESULTS UPDATE\n\n"
              f"{summary}\n"
              f"Updated: {updated}\n"
              f"Unmatched: {unmatched}\n"
              f"Days checked: {days}"
          )

          for chat_id in filter(None, chats):
              requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data={"chat_id": chat_id, "text": message},
                  timeout=30,
              )
          PY
        env:
          DAYS_BACK: ${{ github.event.inputs.days_back || '3' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}

      - name: Commit updated results
        uses: EndBug/add-and-commit@v9
        with:
          author_name: "github-actions[bot]"
          author_email: "41898282+github-actions[bot]@users.noreply.github.com"
          message: "Update prediction history with results"
          add: |
            prediction_history.json
            manual_results.csv

  daily-predictions:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 1 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'predictions' || github.event.inputs.mode == 'all'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch recent results before publishing
        run: python fetch_results.py --days 3 2>&1 | tee fetch_output.txt
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}

      - name: Run Over/Under predictor
        id: over-under
        run: |
          DATE=$(date +'%Y-%m-%d')
          python over25_soccerbase.py > output.txt 2> errors.txt || true
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' output.txt | sed '1d;$d' > over25_body.txt

      - name: Run Home Win predictor
        run: |
          python home_win_soccerbase.py > hw_output.txt 2> hw_errors.txt || true
          sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' hw_output.txt | sed '1d;$d' > hw_body.txt

      - name: Build free and VIP reports
        run: |
          DATE="${{ steps.over-under.outputs.date }}"

          {
            cat over25_body.txt
            echo ""
            cat hw_body.txt
          } > combined_free.txt

          {
            echo "DAILY PREDICTIONS (VIP)"
            echo ""
            if [ -f "over_under_vip_report_$DATE.txt" ]; then
              cat "over_under_vip_report_$DATE.txt"
            else
              cat over25_body.txt
            fi
            echo ""
            if [ -f "home_win_vip_report_$DATE.txt" ]; then
              cat "home_win_vip_report_$DATE.txt"
            else
              cat hw_body.txt
            fi
          } > combined_vip.txt

      - name: Commit predictions and reports
        uses: EndBug/add-and-commit@v9
        with:
          author_name: "github-actions[bot]"
          author_email: "41898282+github-actions[bot]@users.noreply.github.com"
          message: "Daily update: predictions and results"
          add: |
            prediction_history.json
            over_under_25_report_*.json
            home_win_report_*.json
            over_under_vip_report_*.txt
            home_win_vip_report_*.txt
            weekly_report_*.txt
            weekly_report_*.json
            monthly_report_*.txt
            monthly_report_*.json
            README.md

      - name: Send public email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Daily Predictions - ${{ steps.over-under.outputs.date }}"
          body: file://combined_free.txt
          to: ${{ secrets.TO_EMAIL }}
          from: ${{ secrets.EMAIL_USERNAME }}

      - name: Send Telegram free and VIP messages
        if: always()
        run: |
          python - <<'PY'
          import os
          import requests

          def read_file(path):
              if path and os.path.exists(path):
                  with open(path, "r", encoding="utf-8") as f:
                      return f.read().strip()
              return ""

          def send(chat_id, text):
              if not chat_id or not text:
                  return
              max_len = 3900
              chunks = [text[i:i + max_len] for i in range(0, len(text), max_len)]
              for chunk in chunks:
                  requests.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data={"chat_id": chat_id, "text": chunk},
                      timeout=30,
                  )

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          free_channel = os.getenv("TELEGRAM_CHAT_ID")
          vip_channel = os.getenv("TELEGRAM_VIP_CHAT_ID")
          date = os.getenv("DATE")

          if not token or not free_channel:
              print("Skipping Telegram: missing bot token or public chat id.")
              raise SystemExit(0)

          free_report = read_file("combined_free.txt")
          vip_report = read_file("combined_vip.txt")

          send(free_channel, f"DAILY PREDICTIONS ({date})\n\n{free_report}")
          send(vip_channel, vip_report)
          PY
        env:
          DATE: ${{ steps.over-under.outputs.date }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}

  weekly-report:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 3 * * 1' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'weekly' || github.event.inputs.mode == 'all'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Settle results and generate weekly report
        id: report
        run: |
          python fetch_results.py --days 10
          python generate_weekly_report.py
          REPORT_FILE=$(ls -t weekly_report_*.txt 2>/dev/null | head -1)
          echo "file=$REPORT_FILE" >> "$GITHUB_OUTPUT"
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}

      - name: Commit weekly report
        uses: EndBug/add-and-commit@v9
        with:
          author_name: "github-actions[bot]"
          author_email: "41898282+github-actions[bot]@users.noreply.github.com"
          message: "Weekly performance report"
          add: |
            prediction_history.json
            weekly_report_*.txt
            weekly_report_*.json
            README.md

      - name: Send weekly report to Telegram
        if: always()
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          report_file = os.getenv("REPORT_FILE")
          if not token or not report_file or not os.path.exists(report_file):
              print("Skipping Telegram weekly report.")
              raise SystemExit(0)
          with open(report_file, "r", encoding="utf-8") as f:
              report = f.read()
          for chat_id in (os.getenv("TELEGRAM_CHAT_ID"), os.getenv("TELEGRAM_VIP_CHAT_ID")):
              if chat_id:
                  requests.post(f"https://api.telegram.org/bot{token}/sendMessage", data={"chat_id": chat_id, "text": report}, timeout=30)
          PY
        env:
          REPORT_FILE: ${{ steps.report.outputs.file }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}

  monthly-report:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 3 1 * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'monthly' || github.event.inputs.mode == 'all'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Settle results and generate monthly report
        id: report
        run: |
          python fetch_results.py --days 35
          python generate_monthly_report.py
          REPORT_FILE=$(ls -t monthly_report_*.txt 2>/dev/null | head -1)
          echo "file=$REPORT_FILE" >> "$GITHUB_OUTPUT"
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}

      - name: Commit monthly report
        uses: EndBug/add-and-commit@v9
        with:
          author_name: "github-actions[bot]"
          author_email: "41898282+github-actions[bot]@users.noreply.github.com"
          message: "Monthly performance report"
          add: |
            prediction_history.json
            monthly_report_*.txt
            monthly_report_*.json

      - name: Send monthly report to Telegram
        if: always()
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          report_file = os.getenv("REPORT_FILE")
          if not token or not report_file or not os.path.exists(report_file):
              print("Skipping Telegram monthly report.")
              raise SystemExit(0)
          with open(report_file, "r", encoding="utf-8") as f:
              report = f.read()
          for chat_id in (os.getenv("TELEGRAM_CHAT_ID"), os.getenv("TELEGRAM_VIP_CHAT_ID")):
              if chat_id:
                  requests.post(f"https://api.telegram.org/bot{token}/sendMessage", data={"chat_id": chat_id, "text": report}, timeout=30)
          PY
        env:
          REPORT_FILE: ${{ steps.report.outputs.file }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
