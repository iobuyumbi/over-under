name: Daily Predictions + Results Update

on:
  schedule:
    - cron: "0 1 * * *"   # 4:00 AM EAT, 1:00 AM UTC (daily predictions)
    - cron: "0 20 * * *"  # 11:00 PM EAT, 8:00 PM UTC (fetch yesterday's results)
    - cron: "0 3 1 * *"   # 6:00 AM EAT, 3:00 AM UTC on 1st of month (monthly report)
    - cron: "0 3 * * 1"   # 6:00 AM EAT, 3:00 AM UTC on Mondays (weekly report)
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Number of past days to fetch results for'
        required: false
        default: '3'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

jobs:
  predict-and-track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch Match Results
        id: fetch
        run: |
          DAYS="${{ github.event.inputs.days_back || '3' }}"
          python fetch_results.py --days "$DAYS" 2>&1 | tee fetch_output.txt
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}

      - name: Run Over 2.5 Predictor
        id: run-predictor
        run: |
          DATE=$(date +'%Y-%m-%d')
          python over25_soccerbase.py > output.txt 2> errors.txt || true
          echo "date=$DATE" >> $GITHUB_OUTPUT
          
          sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' output.txt | sed '1d;$d' > over25_body.txt

      - name: Run Home Win Predictor
        id: run-home-win
        run: |
          python home_win_soccerbase.py > hw_output.txt 2> hw_errors.txt || true
          
          sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' hw_output.txt | sed '1d;$d' > hw_body.txt

      - name: Generate Monthly Report
        id: monthly-report
        if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '0 1 * * *' && (date +'%d' == '01'))
        run: |
          python generate_monthly_report.py > monthly_output.txt 2> monthly_errors.txt || true
          
          REPORT_FILE=$(ls -t monthly_report_*.txt 2>/dev/null | head -1)
          if [ -f "$REPORT_FILE" ]; then
              echo "report_file=$REPORT_FILE" >> $GITHUB_OUTPUT
          fi

      - name: Generate Weekly Report
        id: weekly-report
        run: |
          python generate_weekly_report.py > weekly_output.txt 2> weekly_errors.txt || true

          REPORT_FILE=$(ls -t weekly_report_*.txt 2>/dev/null | head -1)
          if [ -f "$REPORT_FILE" ]; then
              echo "report_file=$REPORT_FILE" >> $GITHUB_OUTPUT
          fi

      - name: Build combined reports
        id: combined-reports
        run: |
          DATE="${{ steps.run-predictor.outputs.date }}"
          
          # Build FREE REPORT (no affiliate links, no "Free" mention)
          {
            sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' output.txt | sed '1d;$d'
            echo ""
            sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' hw_output.txt | sed '1d;$d'
          } > combined_free.txt
          
          # Build VIP REPORT (detailed)
          {
            echo "DAILY PREDICTIONS (VIP)"
            echo ""
            # Load detailed VIP reports if available
            if [ -f "over_under_vip_report_$DATE.txt" ]; then
                cat "over_under_vip_report_$DATE.txt"
            else
                sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' output.txt | sed '1d;$d'
            fi
            echo ""
            if [ -f "home_win_vip_report_$DATE.txt" ]; then
                cat "home_win_vip_report_$DATE.txt"
            else
                sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' hw_output.txt | sed '1d;$d'
            fi
          } > combined_vip.txt

      - name: Commit & Push Reports
        uses: EndBug/add-and-commit@v9
        with:
          author_name: "github-actions[bot]"
          author_email: "41898282+github-actions[bot]@users.noreply.github.com"
          message: "Daily automated update - $(date)"
          add: |
            *.json
            README.md
            prediction_history.json
            weekly_report_*.txt
            weekly_report_*.json
            monthly_report_*.txt
            monthly_report_*.json
            over_under_25_report_*.json
            home_win_report_*.json
            over_under_vip_report_*.txt
            home_win_vip_report_*.txt

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Daily Predictions - ${{ steps.run-predictor.outputs.date }}"
          body: file://combined_free.txt
          to: ${{ secrets.TO_EMAIL }}
          from: ${{ secrets.EMAIL_USERNAME }}

      - name: Send Telegram notifications (Free + VIP)
        if: always()
        run: |
          python -c '
          import os, requests

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          free_channel = os.getenv("TELEGRAM_CHAT_ID")
          vip_channel = os.getenv("TELEGRAM_VIP_CHAT_ID", "")
          date = os.getenv("DATE")
          monthly_report_file = os.getenv("MONTHLY_REPORT_FILE")
          weekly_report_file = os.getenv("WEEKLY_REPORT_FILE")

          if not token or not free_channel:
              print("Missing Telegram credentials.")
              exit(0)

          # Read reports
          free_report = ""
          vip_report = ""
          monthly_report = ""
          weekly_report = ""

          if os.path.exists("combined_free.txt"):
              with open("combined_free.txt", "r", encoding="utf-8") as f:
                  free_report = f.read()

          if os.path.exists("combined_vip.txt"):
              with open("combined_vip.txt", "r", encoding="utf-8") as f:
                  vip_report = f.read()

          if monthly_report_file and os.path.exists(monthly_report_file):
              with open(monthly_report_file, "r", encoding="utf-8") as f:
                  monthly_report = f.read()

          if weekly_report_file and os.path.exists(weekly_report_file):
              with open(weekly_report_file, "r", encoding="utf-8") as f:
                  weekly_report = f.read()

          # --- FREE CHANNEL (no affiliate links, no "Free" mention) ---
          if free_channel:
              # Send monthly report first if available
              if monthly_report:
                  try:
                      requests.post(
                          f"https://api.telegram.org/bot{token}/sendMessage",
                          data={"chat_id": free_channel, "text": monthly_report}
                      )
                  except Exception as e:
                      print(f"Monthly report error: {e}")

              if weekly_report:
                  try:
                      requests.post(
                          f"https://api.telegram.org/bot{token}/sendMessage",
                          data={"chat_id": free_channel, "text": weekly_report}
                      )
                  except Exception as e:
                      print(f"Weekly report error: {e}")

              # Send daily free report (no affiliate links)
              if free_report:
                  public_msg = (
                      f"DAILY PREDICTIONS ({date})\n\n"
                      f"{free_report}"
                  )
                  if len(public_msg) > 4000:
                      public_msg = public_msg[:3900] + "\n\n...[truncated]"
                  try:
                      requests.post(
                          f"https://api.telegram.org/bot{token}/sendMessage",
                          data={"chat_id": free_channel, "text": public_msg}
                      )
                  except Exception as e:
                      print(f"Free channel error: {e}")

          # --- VIP CHANNEL (optional, if TELEGRAM_VIP_CHAT_ID is set) ---
          if vip_channel and vip_report:
              # Send monthly report first if available
              if monthly_report:
                  try:
                      requests.post(
                          f"https://api.telegram.org/bot{token}/sendMessage",
                          data={"chat_id": vip_channel, "text": monthly_report}
                      )
                  except Exception as e:
                      print(f"Monthly report VIP error: {e}")

              if weekly_report:
                  try:
                      requests.post(
                          f"https://api.telegram.org/bot{token}/sendMessage",
                          data={"chat_id": vip_channel, "text": weekly_report}
                      )
                  except Exception as e:
                      print(f"Weekly report VIP error: {e}")

              # Send daily VIP report
              if len(vip_report) > 4000:
                  vip_report = vip_report[:3900] + "\n\n...[truncated]"
              try:
                  requests.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data={"chat_id": vip_channel, "text": vip_report}
                  )
              except Exception as e:
                  print(f"VIP channel error: {e}")
          '
        env:
          DATE: ${{ steps.run-predictor.outputs.date }}
          MONTHLY_REPORT_FILE: ${{ steps.monthly-report.outputs.report_file }}
          WEEKLY_REPORT_FILE: ${{ steps.weekly-report.outputs.report_file }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID || '' }}
