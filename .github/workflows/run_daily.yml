name: Daily Over 2.5 Goals Predictions

on:
  schedule:
    - cron: "0 2 * * *"  # 7 AM London time (BST)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run predictor and capture output
        id: run-predictor
        run: |
          DATE=$(date +'%Y-%m-%d')
          python over25_soccerbase.py > output.txt 2> errors.txt
          echo "date=$DATE" >> $GITHUB_OUTPUT
          
          # Extract just the email content between markers
          EMAIL_BODY=$(sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' output.txt | sed '1d;$d')
          
          # Write to GITHUB_OUTPUT using EOF delimiter
          {
            echo "email_body<<EOF"
            echo "$EMAIL_BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Commit and push results
        uses: EndBug/add-and-commit@v9
        with:
          author_name: "github-actions[bot]"
          author_email: "github-actions[bot]@users.noreply.github.com"
          message: "Daily predictions update (${{ steps.run-predictor.outputs.date }})"
          add: "predictions_soccerbase_*.json"

      - name: Send email with results
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Daily Over 2.5 Predictions - ${{ steps.run-predictor.outputs.date }}"
          body: ${{ steps.run-predictor.outputs.email_body }}
          to: ${{ secrets.TO_EMAIL }}
          from: ${{ secrets.EMAIL_USERNAME }}

      - name: Run Home Win predictor
        id: run-home-win
        run: |
          DATE=$(date +'%Y-%m-%d')
          python home_win_soccerbase.py > hw_output.txt 2> hw_errors.txt
          
          EMAIL_BODY=$(sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' hw_output.txt | sed '1d;$d')
          
          {
            echo "hw_email<<EOF"
            echo "$EMAIL_BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Send Home Win email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Daily Home Win Predictions - ${{ steps.run-predictor.outputs.date }}"
          body: ${{ steps.run-home-win.outputs.hw_email }}
          to: ${{ secrets.TO_EMAIL }}
          from: ${{ secrets.EMAIL_USERNAME }}


