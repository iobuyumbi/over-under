name: Daily Soccer Predictions + Results

on:
  schedule:
    - cron: "0 1 * * *"   # 4:00 AM EAT: publish already-committed daily predictions to Telegram
    - cron: "0 22 * * *"  # 1:00 AM EAT: settle recent results
    - cron: "0 3 * * 1"   # 6:00 AM EAT Mondays: weekly report (settle + publish)
    - cron: "0 3 1 * *"   # 6:00 AM EAT on the 1st: monthly report (settle + publish)
  workflow_dispatch:
    inputs:
      mode:
        description: "What should this manual run do?"
        required: true
        default: "publish"
        type: choice
        options:
          - results
          - publish
          - weekly
          - monthly
          - all
      days_back:
        description: "Number of past days to fetch results for"
        required: false
        default: "3"
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-results:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    if: github.event.schedule == '0 22 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'results' || github.event.inputs.mode == 'all'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Soccerbase scrape cache
        uses: actions/cache@v4
        with:
          path: |
            soccerbase_cache_*.db
            soccerbase_cache*.db
            *.sqlite
            *.sqlite3
          key: soccerbase-scrape-cache-${{ github.run_id }}
          restore-keys: |
            soccerbase-scrape-cache-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        timeout-minutes: 15
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch and settle match results
        timeout-minutes: 90
        run: |
          DAYS="${{ github.event.inputs.days_back || '3' }}"
          for attempt in 1 2 3; do
            echo "=== Fetch attempt $attempt ==="
            if python fetch_results.py --days "$DAYS" 2>&1 | tee fetch_output_automated.txt; then
              echo "Fetch OK on attempt $attempt"
              break
            fi
            echo "Attempt $attempt failed, retrying in 60s..."
            sleep 60
          done
          python update_manual_results.py 2>&1 | tee update_manual_output.txt || true
          python fetch_results.py --days "$DAYS" 2>&1 | tee fetch_output.txt || true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}

      - name: Upload fetch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-logs-${{ github.run_id }}
          path: |
            fetch_output_automated.txt
            fetch_output.txt
            update_manual_output.txt
            selected_results_report.txt

      - name: Send Telegram selected match results
        if: always()
        run: python send_results_telegram.py
        env:
          DAYS_BACK: ${{ github.event.inputs.days_back || '3' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add prediction_history.json manual_results.csv
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Update prediction history with results"
            git push origin main
          fi

  publish-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    if: |
      github.event.schedule == '0 1 * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'publish' || github.event.inputs.mode == 'all'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (dotenv + requests for Telegram sender)
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Sync with latest main
        run: git pull --rebase origin main

      - name: Determine publish date (EAT = UTC+3)
        id: date
        run: |
          DATE="$(python -c "from datetime import datetime,timedelta; print((datetime.utcnow()+timedelta(hours=3)).strftime('%Y-%m-%d'))")"
          echo "Using publish date: $DATE"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Verify committed report files exist
        run: |
          DATE="${{ steps.date.outputs.date }}"
          echo "=== Checking today's committed files for $DATE ==="
          for f in ou_telegram.txt btts_telegram.txt hw_telegram.txt oo05_telegram.txt telegram.txt curated.txt curated.json; do
            if [ -f "$f" ]; then echo "OK  $f ($(wc -c < "$f") bytes)"; else echo "MISSING $f (expected from run_local.bat commit)"; fi
          done
          echo ""
          echo "=== Checking VIP reports for $DATE ==="
          for f in \
            "over_under_vip_report_${DATE}.txt" "btts_vip_report_${DATE}.txt" \
            "home_win_vip_report_${DATE}.txt" "over05_team_goal_vip_report_${DATE}.txt" \
            "over_under_25_report_${DATE}.json" "btts_report_${DATE}.json" \
            "home_win_report_${DATE}.json" "over05_team_goal_report_${DATE}.json"; do
            if [ -f "$f" ]; then echo "OK  $f ($(wc -c < "$f") bytes)"; else echo "MISSING $f (optional)"; fi
          done

      - name: Publish committed reports to Telegram (free + VIP)
        run: python send_daily_telegram.py
        env:
          DATE: ${{ steps.date.outputs.date }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}

      - name: Upload publish artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-publish-${{ steps.date.outputs.date }}-${{ github.run_id }}
          path: |
            ou_telegram.txt
            btts_telegram.txt
            hw_telegram.txt
            oo05_telegram.txt
            telegram.txt
            curated.txt
            curated.json
            over_under_vip_report_*.txt
            btts_vip_report_*.txt
            home_win_vip_report_*.txt
            over05_team_goal_vip_report_*.txt
          if-no-files-found: warn

  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    if: github.event.schedule == '0 3 * * 1' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'weekly' || github.event.inputs.mode == 'all'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Sync with latest main
        run: git pull --rebase origin main

      - name: Settle results and generate weekly report
        id: report
        continue-on-error: true
        run: |
          python fetch_results.py --days 10 || true
          python update_manual_results.py || true
          python fetch_results.py --days 10 || true
          python generate_weekly_report.py
          REPORT_FILE=$(ls -t weekly_report_*.txt 2>/dev/null | head -1)
          echo "Latest weekly report: $REPORT_FILE"
          echo "file=$REPORT_FILE" >> "$GITHUB_OUTPUT"
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}

      - name: Commit weekly report + settled results
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          shopt -s nullglob
          files=(weekly_report_*.txt weekly_report_*.json)
          if [ ${#files[@]} -gt 0 ]; then
            git add "${files[@]}"
          fi
          git add prediction_history.json manual_results.csv README.md
          if git diff --cached --quiet; then
            echo "No weekly report changes to commit."
          else
            git commit -m "Weekly performance report"
            git push origin main
          fi

      - name: Send weekly report to Telegram
        if: always()
        run: python send_periodic_telegram.py
        env:
          REPORT_FILE: ${{ steps.report.outputs.file }}
          PERIOD: weekly
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}

  monthly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    if: github.event.schedule == '0 3 1 * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'monthly' || github.event.inputs.mode == 'all'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Sync with latest main
        run: git pull --rebase origin main

      - name: Settle results and generate monthly report
        id: report
        continue-on-error: true
        run: |
          python fetch_results.py --days 35 || true
          python update_manual_results.py || true
          python fetch_results.py --days 35 || true
          python generate_monthly_report.py
          REPORT_FILE=$(ls -t monthly_report_*.txt 2>/dev/null | head -1)
          echo "Latest monthly report: $REPORT_FILE"
          echo "file=$REPORT_FILE" >> "$GITHUB_OUTPUT"
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}

      - name: Commit monthly report + settled results
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          shopt -s nullglob
          files=(monthly_report_*.txt monthly_report_*.json)
          if [ ${#files[@]} -gt 0 ]; then
            git add "${files[@]}"
          fi
          git add prediction_history.json manual_results.csv
          if git diff --cached --quiet; then
            echo "No monthly report changes to commit."
          else
            git commit -m "Monthly performance report"
            git push origin main
          fi

      - name: Send monthly report to Telegram
        if: always()
        run: python send_periodic_telegram.py
        env:
          REPORT_FILE: ${{ steps.report.outputs.file }}
          PERIOD: monthly
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
