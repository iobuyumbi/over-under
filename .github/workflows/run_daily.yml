name: Daily Over 2.5 Goals Predictions

on:
  schedule:
    # Runs every day at 03:00 UTC
    - cron: "0 3 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run predictor and isolate email content
        id: run-predictor
        run: |
          # Get today's date in YYYY-MM-DD format
          DATE=$(date +'%Y-%m-%d')
          echo "date=$DATE" >> $GITHUB_OUTPUT
          
          # Run script and save all console logs out of the way
          python over25_soccerbase.py > console_output.txt 2>&1
          cat console_output.txt # Keep visible in GitHub Actions run histories
          
          # Extract the optimized email text between the markers
          sed -n '/===EMAIL_START===/,/===EMAIL_END===\|$/p' console_output.txt | grep -v -E "===EMAIL_START===|===EMAIL_END===" > email_body.txt
          
          # Format output correctly into GITHUB_OUTPUT environment variable
          echo "output<<EOF" >> $GITHUB_OUTPUT
          cat email_body.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit and push results
        uses: EndBug/add-and-commit@v9
        with:
          author_name: "github-actions[bot]"
          author_email: "github-actions[bot]@users.noreply.github.com"
          message: "Daily predictions update (${{ steps.run-predictor.outputs.date }})"
          add: "predictions_soccerbase_*.json"

      - name: Send email with results
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Daily Over 2.5 Predictions - ${{ steps.run-predictor.outputs.date }}"
          body: ${{ steps.run-predictor.outputs.output }}
          to: ${{ secrets.TO_EMAIL }}
          from: ${{ secrets.EMAIL_USERNAME }}
          
