name: Daily Predictions (Over 2.5 + Home Win)

on:
  schedule:
    - cron: "0 1 * * *"  # 6:00 AM EAT, 3:00 AM UTC (daily)
    - cron: "0 3 1 * *"  # 5:00 AM EAT, 2:00 AM UTC on 1st of month (monthly report)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # --- FETCH YESTERDAY'S RESULTS ---
      - name: Fetch Yesterday's Match Results
        run: |
          python fetch_results.py > fetch_output.txt 2> fetch_errors.txt || true
          cat fetch_output.txt

      - name: Commit Updated Prediction History
        uses: EndBug/add-and-commit@v9
        with:
          author_name: "github-actions[bot]"
          author_email: "github-actions[bot]@users.noreply.github.com"
          message: "Update prediction history with yesterday's results"
          add: |
            prediction_history.json

      # --- ENGINE 1: OVER 2.5 PREDICTIONS ---
      - name: Run Over 2.5 predictor
        id: run-predictor
        run: |
          DATE=$(date +'%Y-%m-%d')
          python over25_soccerbase.py > output.txt 2> errors.txt || true
          echo "date=$DATE" >> $GITHUB_OUTPUT
          
          sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' output.txt | sed '1d;$d' > over25_body.txt

      # --- ENGINE 2: 9-POINT HOME WIN PREDICTIONS ---
      - name: Run Home Win predictor
        id: run-home-win
        run: |
          python home_win_soccerbase.py > hw_output.txt 2> hw_errors.txt || true
          
          sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' hw_output.txt | sed '1d;$d' > hw_body.txt

      # --- MONTHLY REPORT (only on 1st day of month) ---
      - name: Generate Monthly Report
        id: monthly-report
        if: github.event.schedule == '0 3 1 * *' || github.event_name == 'workflow_dispatch'
        run: |
          python generate_monthly_report.py > monthly_output.txt 2> monthly_errors.txt || true
          
          # Find the latest monthly report text file
          REPORT_FILE=$(ls -t monthly_report_*.txt 2>/dev/null | head -1)
          if [ -f "$REPORT_FILE" ]; then
              echo "report_file=$REPORT_FILE" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push results
        uses: EndBug/add-and-commit@v9
        with:
          author_name: "github-actions[bot]"
          author_email: "github-actions[bot]@users.noreply.github.com"
          message: "Daily predictions update (${{ steps.run-predictor.outputs.date }})"
          add: |
            over_under_25_report_*.json
            home_win_report_*.json
            over_under_vip_report_*.txt
            home_win_vip_report_*.txt

      # --- CONSOLIDATION ENGINE ---
      - name: Build combined reports
        id: combined-reports
        run: |
          DATE="${{ steps.run-predictor.outputs.date }}"
          SEPARATOR=$(printf '=%.0s' {1..40})
          
          # Build FREE REPORT (simplified for public sharing)
          {
            echo "⚽ DAILY PREDICTIONS (FREE)"
            echo "$SEPARATOR"
            echo ""
            sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' output.txt | sed '1d;$d'
            echo ""
            echo "$SEPARATOR"
            echo ""
            sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' hw_output.txt | sed '1d;$d'
          } > combined_free.txt
          
          # Build VIP REPORT (detailed)
          {
            echo "⚽ DAILY PREDICTIONS (VIP)"
            echo "$SEPARATOR"
            echo ""
            # Load detailed VIP reports if available
            if [ -f "over_under_vip_report_$DATE.txt" ]; then
                cat "over_under_vip_report_$DATE.txt"
            else
                sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' output.txt | sed '1d;$d'
            fi
            echo ""
            echo "$SEPARATOR"
            echo ""
            if [ -f "home_win_vip_report_$DATE.txt" ]; then
                cat "home_win_vip_report_$DATE.txt"
            else
                sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' hw_output.txt | sed '1d;$d'
            fi
          } > combined_vip.txt

      # --- NOTIFICATION DELIVERY ---
      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Daily Predictions - ${{ steps.run-predictor.outputs.date }}"
          body: file://combined_free.txt
          to: ${{ secrets.TO_EMAIL }}
          from: ${{ secrets.EMAIL_USERNAME }}

      - name: Send Telegram notifications (Free + VIP)
        if: always()
        run: |
          python -c '
          import os, requests

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          free_channel = os.getenv("TELEGRAM_CHAT_ID")
          vip_channel = os.getenv("TELEGRAM_VIP_CHAT_ID", "")
          date = os.getenv("DATE")
          monthly_report_file = os.getenv("MONTHLY_REPORT_FILE")

          if not token or not free_channel:
              print("Missing Telegram credentials.")
              exit(0)

          # Read reports
          free_report = ""
          vip_report = ""
          monthly_report = ""

          if os.path.exists("combined_free.txt"):
              with open("combined_free.txt", "r", encoding="utf-8") as f:
                  free_report = f.read()

          if os.path.exists("combined_vip.txt"):
              with open("combined_vip.txt", "r", encoding="utf-8") as f:
                  vip_report = f.read()

          if monthly_report_file and os.path.exists(monthly_report_file):
              with open(monthly_report_file, "r", encoding="utf-8") as f:
                  monthly_report = f.read()

          # --- FREE CHANNEL (using existing TELEGRAM_CHAT_ID) ---
          if free_channel:
              # Send monthly report first if available
              if monthly_report:
                  try:
                      requests.post(
                          f"https://api.telegram.org/bot{token}/sendMessage",
                          data={"chat_id": free_channel, "text": monthly_report}
                      )
                  except Exception as e:
                      print(f"Monthly report error: {e}")

              # Send daily free report
              if free_report:
                  public_msg = (
                      f"📢 DAILY PREDICTIONS ({date})\n"
                      f"========================================\n\n"
                      f"{free_report}\n\n"
                      f"💡 Support our free service by registering using our affiliate link!\n"
                      f"🔗 Place Your Bookmaker Affiliate Link Here"
                  )
                  if len(public_msg) > 4000:
                      public_msg = public_msg[:3900] + "\n\n...[truncated]"
                  try:
                      requests.post(
                          f"https://api.telegram.org/bot{token}/sendMessage",
                          data={"chat_id": free_channel, "text": public_msg}
                      )
                  except Exception as e:
                      print(f"Free channel error: {e}")

          # --- VIP CHANNEL (optional, if TELEGRAM_VIP_CHAT_ID is set) ---
          if vip_channel and vip_report:
              # Send monthly report first if available
              if monthly_report:
                  try:
                      requests.post(
                          f"https://api.telegram.org/bot{token}/sendMessage",
                          data={"chat_id": vip_channel, "text": monthly_report}
                      )
                  except Exception as e:
                      print(f"Monthly report VIP error: {e}")

              # Send daily VIP report
              if len(vip_report) > 4000:
                  vip_report = vip_report[:3900] + "\n\n...[truncated]"
              try:
                  requests.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data={"chat_id": vip_channel, "text": vip_report}
                  )
              except Exception as e:
                  print(f"VIP channel error: {e}")
          '
        env:
          DATE: ${{ steps.run-predictor.outputs.date }}
          MONTHLY_REPORT_FILE: ${{ steps.monthly-report.outputs.report_file }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID || '' }}
