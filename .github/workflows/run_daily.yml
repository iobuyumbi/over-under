name: Daily Soccer Predictions + Results

on:
  schedule:
    - cron: "0 1 * * *"   # 4:00 AM EAT: daily predictions
    - cron: "0 20 * * *"  # 11:00 PM EAT: settle recent results
    - cron: "0 3 * * 1"   # 6:00 AM EAT Mondays: weekly report
    - cron: "0 3 1 * *"   # 6:00 AM EAT on the 1st: monthly report
  workflow_dispatch:
    inputs:
      mode:
        description: "What should this manual run do?"
        required: true
        default: "results"
        type: choice
        options:
          - results
          - predictions
          - weekly
          - monthly
          - all
      days_back:
        description: "Number of past days to fetch results for"
        required: false
        default: "3"
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-results:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 20 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'results' || github.event.inputs.mode == 'all'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch and settle match results
        run: |
          DAYS="${{ github.event.inputs.days_back || '3' }}"
          python fetch_results.py --days "$DAYS" 2>&1 | tee fetch_output_automated.txt
          python update_manual_results.py 2>&1 | tee update_manual_output.txt
          python fetch_results.py --days "$DAYS" 2>&1 | tee fetch_output.txt
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}

      - name: Upload fetch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-logs-${{ github.run_id }}
          path: |
            fetch_output_automated.txt
            fetch_output.txt
            update_manual_output.txt
            selected_results_report.txt

      - name: Send Telegram selected match results
        if: always()
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          chats = [os.getenv("TELEGRAM_CHAT_ID"), os.getenv("TELEGRAM_VIP_CHAT_ID")]
          days = os.getenv("DAYS_BACK", "3")

          if not token or not any(chats):
              print("Skipping Telegram results summary: missing bot token or chat id.")
              raise SystemExit(0)

          if os.path.exists("selected_results_report.txt"):
              with open("selected_results_report.txt", "r", encoding="utf-8", errors="replace") as f:
                  report = f.read().strip()
          else:
              report = "No selected-match result report was generated."

          message = f"SELECTED MATCH RESULTS\nDays checked: {days}\n\n{report}"
          chunks = [message[i:i + 3900] for i in range(0, len(message), 3900)]

          for chat_id in filter(None, chats):
              for chunk in chunks:
                  requests.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data={"chat_id": chat_id, "text": chunk},
                      timeout=30,
                  )
          PY
        env:
          DAYS_BACK: ${{ github.event.inputs.days_back || '3' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add prediction_history.json manual_results.csv
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Update prediction history with results"
            git push origin main
          fi

  daily-predictions:
    runs-on: ubuntu-latest
    needs: fetch-results
    if: |
      always() &&
      !cancelled() &&
      (needs.fetch-results.result == 'success' || needs.fetch-results.result == 'skipped') &&
      (github.event.schedule == '0 1 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'predictions' || github.event.inputs.mode == 'all')))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Sync with latest main
        run: git pull --rebase origin main

      - name: Fetch recent results before publishing
        run: |
          python fetch_results.py --days 3 2>&1 | tee fetch_output_automated.txt
          python update_manual_results.py 2>&1 | tee update_manual_output.txt
          python fetch_results.py --days 3 2>&1 | tee fetch_output.txt
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}

      - name: Run Over/Under predictor
        id: over-under
        run: |
          DATE=$(date +'%Y-%m-%d')
          python over25_soccerbase.py > output.txt 2> errors.txt || true
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' output.txt | sed '1d;$d' > over25_body.txt

      - name: Run Home Win predictor
        run: |
          python home_win_soccerbase.py > hw_output.txt 2> hw_errors.txt || true
          sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' hw_output.txt | sed '1d;$d' > hw_body.txt

      - name: Run BTTS predictor
        run: |
          python btts_soccerbase.py > btts_output.txt 2> btts_errors.txt || true
          sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' btts_output.txt | sed '1d;$d' > btts_body.txt

      - name: Build free and VIP reports
        run: |
          DATE="${{ steps.over-under.outputs.date }}"

          # Free channel: simplified EMAIL body only (never VIP report files)
          {
            echo "━━━ OVER / UNDER 2.5 ━━━"
            if [ -s over25_body.txt ]; then cat over25_body.txt; else echo "No qualifying picks today."; fi
            echo ""
            echo "━━━ BTTS (YES / NO) ━━━"
            if [ -s btts_body.txt ]; then cat btts_body.txt; else echo "No qualifying BTTS picks today."; fi
            echo ""
            echo "━━━ HOME WIN ━━━"
            if [ -s hw_body.txt ]; then cat hw_body.txt; else echo "No qualifying home win picks today."; fi
          } > combined_free.txt

          # VIP channel: full detail from VIP report files
          {
            echo "DAILY PREDICTIONS (VIP)"
            echo ""
            if [ -f "over_under_vip_report_$DATE.txt" ]; then
              cat "over_under_vip_report_$DATE.txt"
            else
              echo "Over/Under report unavailable."
            fi
            echo ""
            if [ -f "btts_vip_report_$DATE.txt" ]; then
              cat "btts_vip_report_$DATE.txt"
            else
              echo "BTTS report unavailable."
            fi
            echo ""
            if [ -f "home_win_vip_report_$DATE.txt" ]; then
              cat "home_win_vip_report_$DATE.txt"
            else
              echo "Home win report unavailable."
            fi
          } > combined_vip.txt

      - name: Commit predictions and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          shopt -s nullglob
          files=(over_under_25_report_*.json home_win_report_*.json btts_report_*.json over_under_vip_report_*.txt home_win_vip_report_*.txt btts_vip_report_*.txt)
          if [ ${#files[@]} -gt 0 ]; then
            git add "${files[@]}"
          fi
          git add prediction_history.json manual_results.csv README.md
          if git diff --cached --quiet; then
            echo "No prediction/report changes to commit."
          else
            git commit -m "Daily update: predictions and results"
            git push origin main
          fi

      - name: Send public email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Daily Predictions - ${{ steps.over-under.outputs.date }}"
          body: file://combined_free.txt
          to: ${{ secrets.TO_EMAIL }}
          from: ${{ secrets.EMAIL_USERNAME }}

      - name: Send Telegram free and VIP messages
        if: always()
        run: |
          python - <<'PY'
          import os
          import requests

          def read_file(path):
              if path and os.path.exists(path):
                  with open(path, "r", encoding="utf-8") as f:
                      return f.read().strip()
              return ""

          def send(chat_id, text):
              if not chat_id or not text:
                  return
              max_len = 3900
              chunks = [text[i:i + max_len] for i in range(0, len(text), max_len)]
              for chunk in chunks:
                  requests.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data={"chat_id": chat_id, "text": chunk},
                      timeout=30,
                  )

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          free_channel = os.getenv("TELEGRAM_CHAT_ID")
          vip_channel = os.getenv("TELEGRAM_VIP_CHAT_ID")
          date = os.getenv("DATE")

          if not token or not free_channel:
              print("Skipping Telegram: missing bot token or public chat id.")
              raise SystemExit(0)

          free_report = read_file("combined_free.txt")
          vip_report = read_file("combined_vip.txt")

          send(free_channel, f"DAILY PREDICTIONS ({date})\n\n{free_report}")
          send(vip_channel, vip_report)
          PY
        env:
          DATE: ${{ steps.over-under.outputs.date }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}

  weekly-report:
    runs-on: ubuntu-latest
    needs: daily-predictions
    if: |
      always() &&
      !cancelled() &&
      (needs.daily-predictions.result == 'success' || needs.daily-predictions.result == 'skipped') &&
      (github.event.schedule == '0 3 * * 1' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'weekly' || github.event.inputs.mode == 'all')))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Sync with latest main
        run: git pull --rebase origin main

      - name: Settle results and generate weekly report
        id: report
        run: |
          python fetch_results.py --days 10
          python update_manual_results.py
          python fetch_results.py --days 10
          python generate_weekly_report.py
          REPORT_FILE=$(ls -t weekly_report_*.txt 2>/dev/null | head -1)
          echo "file=$REPORT_FILE" >> "$GITHUB_OUTPUT"
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}

      - name: Commit weekly report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          shopt -s nullglob
          files=(weekly_report_*.txt weekly_report_*.json)
          if [ ${#files[@]} -gt 0 ]; then
            git add "${files[@]}"
          fi
          git add prediction_history.json manual_results.csv README.md
          if git diff --cached --quiet; then
            echo "No weekly report changes to commit."
          else
            git commit -m "Weekly performance report"
            git push origin main
          fi

      - name: Send weekly report to Telegram
        if: always()
        run: |
          python - <<'PY'
          import os
          import requests

          def send(chat_id, text):
              if not chat_id or not text:
                  return
              for chunk in (text[i:i + 3900] for i in range(0, len(text), 3900)):
                  requests.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data={"chat_id": chat_id, "text": chunk},
                      timeout=30,
                  )

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          report_file = os.getenv("REPORT_FILE")
          if not token or not report_file or not os.path.exists(report_file):
              print("Skipping Telegram weekly report.")
              raise SystemExit(0)
          with open(report_file, "r", encoding="utf-8") as f:
              report = f.read().strip()
          for chat_id in (os.getenv("TELEGRAM_CHAT_ID"), os.getenv("TELEGRAM_VIP_CHAT_ID")):
              send(chat_id, report)
          PY
        env:
          REPORT_FILE: ${{ steps.report.outputs.file }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}

  monthly-report:
    runs-on: ubuntu-latest
    needs: weekly-report
    if: |
      always() &&
      !cancelled() &&
      (needs.weekly-report.result == 'success' || needs.weekly-report.result == 'skipped') &&
      (github.event.schedule == '0 3 1 * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'monthly' || github.event.inputs.mode == 'all')))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Sync with latest main
        run: git pull --rebase origin main

      - name: Settle results and generate monthly report
        id: report
        run: |
          python fetch_results.py --days 35
          python update_manual_results.py
          python fetch_results.py --days 35
          python generate_monthly_report.py
          REPORT_FILE=$(ls -t monthly_report_*.txt 2>/dev/null | head -1)
          echo "file=$REPORT_FILE" >> "$GITHUB_OUTPUT"
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}

      - name: Commit monthly report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          shopt -s nullglob
          files=(monthly_report_*.txt monthly_report_*.json)
          if [ ${#files[@]} -gt 0 ]; then
            git add "${files[@]}"
          fi
          git add prediction_history.json manual_results.csv
          if git diff --cached --quiet; then
            echo "No monthly report changes to commit."
          else
            git commit -m "Monthly performance report"
            git push origin main
          fi

      - name: Send monthly report to Telegram
        if: always()
        run: |
          python - <<'PY'
          import os
          import requests

          def send(chat_id, text):
              if not chat_id or not text:
                  return
              for chunk in (text[i:i + 3900] for i in range(0, len(text), 3900)):
                  requests.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data={"chat_id": chat_id, "text": chunk},
                      timeout=30,
                  )

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          report_file = os.getenv("REPORT_FILE")
          if not token or not report_file or not os.path.exists(report_file):
              print("Skipping Telegram monthly report.")
              raise SystemExit(0)
          with open(report_file, "r", encoding="utf-8") as f:
              report = f.read().strip()
          for chat_id in (os.getenv("TELEGRAM_CHAT_ID"), os.getenv("TELEGRAM_VIP_CHAT_ID")):
              send(chat_id, report)
          PY
        env:
          REPORT_FILE: ${{ steps.report.outputs.file }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
