name: Daily Predictions (Over 2.5 + Home Win)

on:
  schedule:
    - cron: "0 5 * * *"  # 6 AM London time (BST), 5 AM GMT
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Over 2.5 predictor
        id: run-predictor
        run: |
          DATE=$(date +'%Y-%m-%d')
          python over25_soccerbase.py > output.txt 2> errors.txt
          echo "date=$DATE" >> $GITHUB_OUTPUT
          
          EMAIL_BODY=$(sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' output.txt | sed '1d;$d')
          
          {
            echo "email_body<<EOF"
            echo "$EMAIL_BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Run Home Win predictor
        id: run-home-win
        run: |
          DATE=$(date +'%Y-%m-%d')
          python home_win_soccerbase.py > hw_output.txt 2> hw_errors.txt
          
          EMAIL_BODY=$(sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' hw_output.txt | sed '1d;$d')
          
          {
            echo "hw_email<<EOF"
            echo "$EMAIL_BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Commit and push results
        uses: EndBug/add-and-commit@v9
        with:
          author_name: "github-actions[bot]"
          author_email: "github-actions[bot]@users.noreply.github.com"
          message: "Daily predictions update (${{ steps.run-predictor.outputs.date }})"
          add: |
            predictions_soccerbase_*.json
            home_win_predictions_*.json

      - name: Build combined email body
        id: combined-email
        run: |
          DATE=${{ steps.run-predictor.outputs.date }}
          
          {
            echo "combined<<EOF"
            echo "⚽ DAILY PREDICTIONS RECAP - $DATE"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            echo "${{ steps.run-predictor.outputs.email_body }}"
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            echo "${{ steps.run-home-win.outputs.hw_email }}"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Daily Predictions - ${{ steps.run-predictor.outputs.date }}"
          body: ${{ steps.combined-email.outputs.combined }}
          to: ${{ secrets.TO_EMAIL }}
          from: ${{ secrets.EMAIL_USERNAME }}

      - name: Send Telegram notification
        if: always()
        run: |
          MESSAGE="${{ steps.combined-email.outputs.combined }}"
          
          # Telegram has 4096 char limit, truncate if needed
          if [ ${#MESSAGE} -gt 4000 ]; then
            MESSAGE="${MESSAGE:0:3900}\n\n...[truncated for Telegram]"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MESSAGE" \
            -d "parse_mode=HTML" || \
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MESSAGE"
