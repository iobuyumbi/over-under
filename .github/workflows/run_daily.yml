name: Daily Soccer Predictions + Results

on:
  schedule:
    - cron: "0 1 * * *"   # 4:00 AM EAT: daily predictions
    - cron: "0 22 * * *"  # 1:00 AM EAT: settle recent results
    - cron: "0 3 * * 1"   # 6:00 AM EAT Mondays: weekly report
    - cron: "0 3 1 * *"   # 6:00 AM EAT on the 1st: monthly report
  workflow_dispatch:
    inputs:
      mode:
        description: "What should this manual run do?"
        required: true
        default: "results"
        type: choice
        options:
          - results
          - predictions
          - weekly
          - monthly
          - all
      days_back:
        description: "Number of past days to fetch results for"
        required: false
        default: "3"
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-results:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    if: github.event.schedule == '0 22 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'results' || github.event.inputs.mode == 'all'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch and settle match results
        shell: bash
        run: |
          DAYS="${{ github.event.inputs.days_back || '3' }}"
          python fetch_results.py --days "$DAYS" 2>&1 | tee fetch_output_automated.txt
          python update_manual_results.py 2>&1 | tee update_manual_output.txt
          python fetch_results.py --days "$DAYS" 2>&1 | tee fetch_output.txt
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}

      - name: Upload fetch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-logs-${{ github.run_id }}
          path: |
            fetch_output_automated.txt
            fetch_output.txt
            update_manual_output.txt
            selected_results_report.txt

      - name: Send Telegram selected match results
        if: always()
        shell: bash
        run: python send_results_telegram.py
        env:
          DAYS_BACK: ${{ github.event.inputs.days_back || '3' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}

      - name: Commit updated results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add prediction_history.json manual_results.csv
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Update prediction history with results"
            git push origin main
          fi

  daily-predictions:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    needs: fetch-results
    if: |
      always() &&
      !cancelled() &&
      (needs.fetch-results.result == 'success' || needs.fetch-results.result == 'skipped') &&
      (github.event.schedule == '0 1 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'predictions' || github.event.inputs.mode == 'all')))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Sync with latest main
        shell: powershell
        run: git pull --rebase origin main

      - name: Fetch recent results before publishing
        shell: powershell
        run: |
          & python fetch_results.py --days 3 *>&1 | Tee-Object -FilePath fetch_output_automated.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "fetch_results (1st) warned: $LASTEXITCODE" }
          & python update_manual_results.py *>&1 | Tee-Object -FilePath update_manual_output.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "update_manual_results warned: $LASTEXITCODE" }
          & python fetch_results.py --days 3 *>&1 | Tee-Object -FilePath fetch_output.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "fetch_results (2nd) warned: $LASTEXITCODE" }
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}

      - name: Run Over/Under predictor
        id: over-under
        continue-on-error: true
        shell: powershell
        run: |
          $DATE = python -c "from datetime import datetime,timedelta; print((datetime.utcnow()+timedelta(hours=3)).strftime('%Y-%m-%d'))"
          Write-Host "Using publish date: $DATE"
          & python over25_soccerbase.py --publish-date "$DATE" > output.txt 2> errors.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "over25 exited: $LASTEXITCODE" }
          "date=$DATE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (Test-Path output.txt) {
            $lines = Get-Content output.txt
            $startIdx = -1; $endIdx = -1
            for ($i=0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '===EMAIL_START===') { $startIdx = $i }
              if ($lines[$i] -match '===EMAIL_END===') { $endIdx = $i }
            }
            if ($startIdx -ge 0 -and $endIdx -gt $startIdx) {
              $lines[($startIdx+1)..($endIdx-1)] | Out-File -FilePath over25_body.txt -Encoding utf8
            } else {
              if (Test-Path over25_body.txt) { Remove-Item over25_body.txt -Force }
            }
          }

      - name: Run Home Win predictor
        id: home-win
        continue-on-error: true
        shell: powershell
        run: |
          $DATE = "${{ steps.over-under.outputs.date }}"
          & python home_win_soccerbase.py --publish-date "$DATE" > hw_output.txt 2> hw_errors.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "home_win exited: $LASTEXITCODE" }
          if (Test-Path hw_output.txt) {
            $lines = Get-Content hw_output.txt
            $startIdx = -1; $endIdx = -1
            for ($i=0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '===EMAIL_START===') { $startIdx = $i }
              if ($lines[$i] -match '===EMAIL_END===') { $endIdx = $i }
            }
            if ($startIdx -ge 0 -and $endIdx -gt $startIdx) {
              $lines[($startIdx+1)..($endIdx-1)] | Out-File -FilePath hw_body.txt -Encoding utf8
            } else {
              if (Test-Path hw_body.txt) { Remove-Item hw_body.txt -Force }
            }
          }

      - name: Run BTTS predictor
        id: btts
        continue-on-error: true
        shell: powershell
        run: |
          $DATE = "${{ steps.over-under.outputs.date }}"
          & python btts_soccerbase.py --publish-date "$DATE" > btts_output.txt 2> btts_errors.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "btts exited: $LASTEXITCODE" }
          if (Test-Path btts_output.txt) {
            $lines = Get-Content btts_output.txt
            $startIdx = -1; $endIdx = -1
            for ($i=0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '===EMAIL_START===') { $startIdx = $i }
              if ($lines[$i] -match '===EMAIL_END===') { $endIdx = $i }
            }
            if ($startIdx -ge 0 -and $endIdx -gt $startIdx) {
              $lines[($startIdx+1)..($endIdx-1)] | Out-File -FilePath btts_body.txt -Encoding utf8
            } else {
              if (Test-Path btts_body.txt) { Remove-Item btts_body.txt -Force }
            }
          }

      - name: Debug predictor output
        if: always()
        shell: powershell
        run: |
          Write-Host "=== Over/Under body size ==="
          if (Test-Path over25_body.txt) { (Get-Item over25_body.txt).Length } else { Write-Host "0" }
          Write-Host "=== Home Win body size ==="
          if (Test-Path hw_body.txt) { (Get-Item hw_body.txt).Length } else { Write-Host "0" }
          Write-Host "=== BTTS body size ==="
          if (Test-Path btts_body.txt) { (Get-Item btts_body.txt).Length } else { Write-Host "0" }
          Write-Host ""
          Write-Host "=== Over/Under Errors ==="
          if (Test-Path errors.txt) { Get-Content errors.txt } else { Write-Host "(none)" }
          Write-Host ""
          Write-Host "=== Home Win Errors ==="
          if (Test-Path hw_errors.txt) { Get-Content hw_errors.txt } else { Write-Host "(none)" }
          Write-Host ""
          Write-Host "=== BTTS Errors ==="
          if (Test-Path btts_errors.txt) { Get-Content btts_errors.txt } else { Write-Host "(none)" }

      - name: Upload predictor logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predictor-logs-${{ github.run_id }}
          path: |
            output.txt
            hw_output.txt
            btts_output.txt
            errors.txt
            hw_errors.txt
            btts_errors.txt
            ou_telegram.txt
            hw_telegram.txt
            btts_telegram.txt

      - name: Build Telegram daily message
        continue-on-error: true
        shell: powershell
        run: |
          $DATE = "${{ steps.over-under.outputs.date }}"
          & python build_telegram_daily.py --date "$DATE" --ou-output ou_telegram.txt --btts-output btts_telegram.txt --hw-output hw_telegram.txt --out telegram_daily.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "build_telegram_daily exited: $LASTEXITCODE" }

      - name: Upload Telegram message
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-message-${{ github.run_id }}
          path: telegram_daily.txt
          if-no-files-found: warn

      - name: Build free and VIP reports
        continue-on-error: true
        shell: powershell
        run: |
          $DATE = "${{ steps.over-under.outputs.date }}"
          $free = @()
          $free += "━━━ OVER / UNDER 2.5 ━━━"
          if ((Test-Path over25_body.txt) -and ((Get-Item over25_body.txt).Length -gt 0)) {
            $free += Get-Content over25_body.txt
          } else {
            $free += "No qualifying picks today."
          }
          $free += ""
          $free += "━━━ BTTS (YES / NO) ━━━"
          if ((Test-Path btts_body.txt) -and ((Get-Item btts_body.txt).Length -gt 0)) {
            $free += Get-Content btts_body.txt
          } else {
            $free += "No qualifying BTTS picks today."
          }
          $free += ""
          $free += "━━━ HOME WIN ━━━"
          if ((Test-Path hw_body.txt) -and ((Get-Item hw_body.txt).Length -gt 0)) {
            $free += Get-Content hw_body.txt
          } else {
            $free += "No qualifying home win picks today."
          }
          $free | Out-File -FilePath combined_free.txt -Encoding utf8

          $vip = @()
          $vip += "DAILY PREDICTIONS (VIP)"
          $vip += ""
          $ouVip = "over_under_vip_report_$DATE.txt"
          if (Test-Path $ouVip) {
            $vip += Get-Content $ouVip
          } else {
            $vip += "Over/Under report unavailable."
          }
          $vip += ""
          $bttsVip = "btts_vip_report_$DATE.txt"
          if (Test-Path $bttsVip) {
            $vip += Get-Content $bttsVip
          } else {
            $vip += "BTTS report unavailable."
          }
          $vip += ""
          $hwVip = "home_win_vip_report_$DATE.txt"
          if (Test-Path $hwVip) {
            $vip += Get-Content $hwVip
          } else {
            $vip += "Home win report unavailable."
          }
          $vip | Out-File -FilePath combined_vip.txt -Encoding utf8

      - name: Commit predictions and reports
        continue-on-error: true
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          $files = @(Get-ChildItem -File -Name "over_under_25_report_*.json" -ErrorAction SilentlyContinue)
          $files += @(Get-ChildItem -File -Name "home_win_report_*.json" -ErrorAction SilentlyContinue)
          $files += @(Get-ChildItem -File -Name "btts_report_*.json" -ErrorAction SilentlyContinue)
          $files += @(Get-ChildItem -File -Name "over_under_vip_report_*.txt" -ErrorAction SilentlyContinue)
          $files += @(Get-ChildItem -File -Name "home_win_vip_report_*.txt" -ErrorAction SilentlyContinue)
          $files += @(Get-ChildItem -File -Name "btts_vip_report_*.txt" -ErrorAction SilentlyContinue)
          $files = @($files | Where-Object { $_ })
          if ($files.Count -gt 0) {
            git add $files
          }
          git add prediction_history.json manual_results.csv README.md
          $diffOutput = git diff --cached --quiet 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No prediction/report changes to commit."
          } else {
            git commit -m "Daily update: predictions and results"
            git push origin main
          }

      - name: Send Telegram free and VIP messages
        if: always()
        shell: powershell
        run: python send_daily_telegram.py
        env:
          DATE: ${{ steps.over-under.outputs.date }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}

  weekly-report:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    if: github.event.schedule == '0 3 * * 1' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'weekly' || github.event.inputs.mode == 'all'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Sync with latest main
        shell: powershell
        run: git pull --rebase origin main

      - name: Settle results and generate weekly report
        id: report
        continue-on-error: true
        shell: powershell
        run: |
          & python fetch_results.py --days 10
          if ($LASTEXITCODE -ne 0) { Write-Host "fetch_results(1) exited: $LASTEXITCODE" }
          & python update_manual_results.py
          if ($LASTEXITCODE -ne 0) { Write-Host "update_manual_results exited: $LASTEXITCODE" }
          & python fetch_results.py --days 10
          if ($LASTEXITCODE -ne 0) { Write-Host "fetch_results(2) exited: $LASTEXITCODE" }
          & python generate_weekly_report.py
          $REPORT_FILE = Get-ChildItem -File weekly_report_*.txt | Sort-Object LastWriteTime -Descending | Select-Object -First 1 -ExpandProperty Name
          Write-Host "Latest weekly report: $REPORT_FILE"
          "file=$REPORT_FILE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Commit weekly report
        continue-on-error: true
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          $files = @(Get-ChildItem -File -Name "weekly_report_*.txt" -ErrorAction SilentlyContinue)
          $files += @(Get-ChildItem -File -Name "weekly_report_*.json" -ErrorAction SilentlyContinue)
          $files = @($files | Where-Object { $_ })
          if ($files.Count -gt 0) {
            git add $files
          }
          git add prediction_history.json manual_results.csv README.md
          $null = git diff --cached --quiet 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No weekly report changes to commit."
          } else {
            git commit -m "Weekly performance report"
            git push origin main
          }

      - name: Send weekly report to Telegram
        if: always()
        shell: powershell
        run: python send_periodic_telegram.py
        env:
          REPORT_FILE: ${{ steps.report.outputs.file }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}

  monthly-report:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    if: github.event.schedule == '0 3 1 * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'monthly' || github.event.inputs.mode == 'all'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Sync with latest main
        shell: powershell
        run: git pull --rebase origin main

      - name: Settle results and generate monthly report
        id: report
        continue-on-error: true
        shell: powershell
        run: |
          & python fetch_results.py --days 35
          if ($LASTEXITCODE -ne 0) { Write-Host "fetch_results(1) exited: $LASTEXITCODE" }
          & python update_manual_results.py
          if ($LASTEXITCODE -ne 0) { Write-Host "update_manual_results exited: $LASTEXITCODE" }
          & python fetch_results.py --days 35
          if ($LASTEXITCODE -ne 0) { Write-Host "fetch_results(2) exited: $LASTEXITCODE" }
          & python generate_monthly_report.py
          $REPORT_FILE = Get-ChildItem -File monthly_report_*.txt | Sort-Object LastWriteTime -Descending | Select-Object -First 1 -ExpandProperty Name
          Write-Host "Latest monthly report: $REPORT_FILE"
          "file=$REPORT_FILE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Commit monthly report
        continue-on-error: true
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          $files = @(Get-ChildItem -File -Name "monthly_report_*.txt" -ErrorAction SilentlyContinue)
          $files += @(Get-ChildItem -File -Name "monthly_report_*.json" -ErrorAction SilentlyContinue)
          $files = @($files | Where-Object { $_ })
          if ($files.Count -gt 0) {
            git add $files
          }
          git add prediction_history.json manual_results.csv
          $null = git diff --cached --quiet 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No monthly report changes to commit."
          } else {
            git commit -m "Monthly performance report"
            git push origin main
          }

      - name: Send monthly report to Telegram
        if: always()
        shell: powershell
        run: python send_periodic_telegram.py
        env:
          REPORT_FILE: ${{ steps.report.outputs.file }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
