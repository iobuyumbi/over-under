name: Daily Over 2.5 Goals Predictions

on:
  schedule:
    # Runs every day at 01:00 UTC
    - cron: "0 1 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run predictor and capture output
        id: run-predictor
        run: |
          # Get today's date in YYYY-MM-DD format
          DATE=$(date +'%Y-%m-%d')
          # Run the script and capture output
          python over25_soccerbase.py 2>&1 | tee output.txt
          echo "date=$DATE" >> $GITHUB_OUTPUT
          # Read output into a variable
          OUTPUT=$(cat output.txt)
          # Use a delimiter that doesn't appear in the output
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit and push results
        uses: EndBug/add-and-commit@v9
        with:
          author_name: "github-actions[bot]"
          author_email: "github-actions[bot]@users.noreply.github.com"
          message: "Daily predictions update (${{ steps.run-predictor.outputs.date }})"
          add: "predictions_soccerbase_*.json"

      - name: Send email with results
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Daily Over 2.5 Predictions - ${{ steps.run-predictor.outputs.date }}"
          body: ${{ steps.run-predictor.outputs.output }}
          to: ${{ secrets.TO_EMAILS }}
          from: ${{ secrets.EMAIL_USERNAME }}
