name: Daily Over 2.5 Goals Predictions

on:
  schedule:
    # Runs every day at 06:00 UTC
    - cron: "0 6 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run predictor
        id: run-predictor
        run: |
          # Get today's date in YYYY-MM-DD format
          DATE=$(date +'%Y-%m-%d')
          # Run the script (uses today's date by default)
          python over25_soccerbase.py
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Commit and push results
        uses: EndBug/add-and-commit@v9
        with:
          author_name: "github-actions[bot]"
          author_email: "github-actions[bot]@users.noreply.github.com"
          message: "Daily predictions update (${{ steps.run-predictor.outputs.date }})"
          add: "predictions_soccerbase_*.json"
