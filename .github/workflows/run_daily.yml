name: Daily Soccer Predictions + Results

on:
  schedule:
    - cron: "0 1 * * *"   # 4:00 AM EAT: daily predictions
    - cron: "0 22 * * *"  # 1:00 AM EAT: settle recent results
    - cron: "0 3 * * 1"   # 6:00 AM EAT Mondays: weekly report
    - cron: "0 3 1 * *"   # 6:00 AM EAT on the 1st: monthly report
  workflow_dispatch:
    inputs:
      mode:
        description: "What should this manual run do?"
        required: true
        default: "results"
        type: choice
        options:
          - results
          - predictions
          - weekly
          - monthly
          - all
      days_back:
        description: "Number of past days to fetch results for"
        required: false
        default: "3"
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-results:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 22 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'results' || github.event.inputs.mode == 'all'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch and settle match results
        run: |
          DAYS="${{ github.event.inputs.days_back || '3' }}"
          python fetch_results.py --days "$DAYS" 2>&1 | tee fetch_output_automated.txt
          python update_manual_results.py 2>&1 | tee update_manual_output.txt
          python fetch_results.py --days "$DAYS" 2>&1 | tee fetch_output.txt
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}

      - name: Upload fetch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-logs-${{ github.run_id }}
          path: |
            fetch_output_automated.txt
            fetch_output.txt
            update_manual_output.txt
            selected_results_report.txt

      - name: Send Telegram selected match results
        if: always()
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          chats = [os.getenv("TELEGRAM_CHAT_ID"), os.getenv("TELEGRAM_VIP_CHAT_ID")]
          days = os.getenv("DAYS_BACK", "3")

          if not token or not any(chats):
              print("Skipping Telegram results summary: missing bot token or chat id.")
              raise SystemExit(0)

          if os.path.exists("selected_results_report.txt"):
              with open("selected_results_report.txt", "r", encoding="utf-8", errors="replace") as f:
                  report = f.read().strip()
          else:
              report = "No selected-match result report was generated."

          message = f"📊 Results\n\n{report}" if report else "📊 Results\n\nNo updates."
          chunks = [message[i:i + 3900] for i in range(0, len(message), 3900)]

          for chat_id in filter(None, chats):
              for chunk in chunks:
                  requests.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data={"chat_id": chat_id, "text": chunk},
                      timeout=30,
                  )
          PY
        env:
          DAYS_BACK: ${{ github.event.inputs.days_back || '3' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add prediction_history.json manual_results.csv
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Update prediction history with results"
            git push origin main
          fi

  daily-predictions:
    runs-on: self-hosted
    needs: fetch-results
    if: |
      always() &&
      !cancelled() &&
      (needs.fetch-results.result == 'success' || needs.fetch-results.result == 'skipped') &&
      (github.event.schedule == '0 1 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'predictions' || github.event.inputs.mode == 'all')))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Sync with latest main
        run: git pull --rebase origin main

      - name: Fetch recent results before publishing
        run: |
          python fetch_results.py --days 3 2>&1 | tee fetch_output_automated.txt || true
          python update_manual_results.py 2>&1 | tee update_manual_output.txt || true
          python fetch_results.py --days 3 2>&1 | tee fetch_output.txt || true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}

      - name: Run Over/Under predictor
        id: over-under
        continue-on-error: true
        run: |
          DATE="$(python -c "from datetime import datetime,timedelta; print((datetime.utcnow()+timedelta(hours=3)).strftime('%Y-%m-%d'))")"
          echo "Using publish date: $DATE"
          python over25_soccerbase.py --publish-date "$DATE" > output.txt 2> errors.txt || true
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' output.txt | sed '1d;$d' > over25_body.txt || true

      - name: Run Home Win predictor
        id: home-win
        continue-on-error: true
        run: |
          DATE="${{ steps.over-under.outputs.date }}"
          python home_win_soccerbase.py --publish-date "$DATE" > hw_output.txt 2> hw_errors.txt || true
          sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' hw_output.txt | sed '1d;$d' > hw_body.txt || true

      - name: Run BTTS predictor
        id: btts
        continue-on-error: true
        run: |
          DATE="${{ steps.over-under.outputs.date }}"
          python btts_soccerbase.py --publish-date "$DATE" > btts_output.txt 2> btts_errors.txt || true
          sed -n '/===EMAIL_START===/,/===EMAIL_END===/p' btts_output.txt | sed '1d;$d' > btts_body.txt || true

      - name: Debug predictor output
        if: always()
        run: |
          echo "=== Over/Under body size ==="
          wc -c over25_body.txt 2>/dev/null || echo "0"
          echo "=== Home Win body size ==="
          wc -c hw_body.txt 2>/dev/null || echo "0"
          echo "=== BTTS body size ==="
          wc -c btts_body.txt 2>/dev/null || echo "0"
          echo ""
          echo "=== Over/Under Errors ==="
          cat errors.txt 2>/dev/null || echo "(none)"
          echo ""
          echo "=== Home Win Errors ==="
          cat hw_errors.txt 2>/dev/null || echo "(none)"
          echo ""
          echo "=== BTTS Errors ==="
          cat btts_errors.txt 2>/dev/null || echo "(none)"

      - name: Upload predictor logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predictor-logs-${{ github.run_id }}
          path: |
            output.txt
            hw_output.txt
            btts_output.txt
            errors.txt
            hw_errors.txt
            btts_errors.txt
            ou_telegram.txt
            hw_telegram.txt
            btts_telegram.txt

      - name: Build Telegram daily message
        continue-on-error: true
        run: |
          DATE="${{ steps.over-under.outputs.date }}"
          python build_telegram_daily.py --date "$DATE" \
            --ou-output ou_telegram.txt \
            --btts-output btts_telegram.txt \
            --hw-output hw_telegram.txt \
            --out telegram_daily.txt || true

      - name: Upload Telegram message
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-message-${{ github.run_id }}
          path: telegram_daily.txt
          if-no-files-found: warn

      - name: Build free and VIP reports
        continue-on-error: true
        run: |
          DATE="${{ steps.over-under.outputs.date }}"

          {
            echo "━━━ OVER / UNDER 2.5 ━━━"
            if [ -s over25_body.txt ]; then cat over25_body.txt; else echo "No qualifying picks today."; fi
            echo ""
            echo "━━━ BTTS (YES / NO) ━━━"
            if [ -s btts_body.txt ]; then cat btts_body.txt; else echo "No qualifying BTTS picks today."; fi
            echo ""
            echo "━━━ HOME WIN ━━━"
            if [ -s hw_body.txt ]; then cat hw_body.txt; else echo "No qualifying home win picks today."; fi
          } > combined_free.txt

          {
            echo "DAILY PREDICTIONS (VIP)"
            echo ""
            if [ -f "over_under_vip_report_$DATE.txt" ]; then
              cat "over_under_vip_report_$DATE.txt"
            else
              echo "Over/Under report unavailable."
            fi
            echo ""
            if [ -f "btts_vip_report_$DATE.txt" ]; then
              cat "btts_vip_report_$DATE.txt"
            else
              echo "BTTS report unavailable."
            fi
            echo ""
            if [ -f "home_win_vip_report_$DATE.txt" ]; then
              cat "home_win_vip_report_$DATE.txt"
            else
              echo "Home win report unavailable."
            fi
          } > combined_vip.txt

      - name: Commit predictions and reports
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          shopt -s nullglob
          files=(over_under_25_report_*.json home_win_report_*.json btts_report_*.json over_under_vip_report_*.txt home_win_vip_report_*.txt btts_vip_report_*.txt)
          if [ ${#files[@]} -gt 0 ]; then
            git add "${files[@]}"
          fi
          git add prediction_history.json manual_results.csv README.md
          if git diff --cached --quiet; then
            echo "No prediction/report changes to commit."
          else
            git commit -m "Daily update: predictions and results"
            git push origin main
          fi

      - name: Send Telegram free and VIP messages
        if: always()
        run: |
          python - <<'PY'
          import os
          import requests

          def read_file(path):
              if path and os.path.exists(path):
                  with open(path, "r", encoding="utf-8") as f:
                      return f.read().strip()
              return ""

          def send(chat_id, text):
              if not chat_id or not text:
                  return
              max_len = 3900
              chunks = [text[i:i + max_len] for i in range(0, len(text), max_len)]
              for chunk in chunks:
                  try:
                      r = requests.post(
                          f"https://api.telegram.org/bot{token}/sendMessage",
                          data={"chat_id": chat_id, "text": chunk},
                          timeout=30,
                      )
                      print(f"Sent chunk to {chat_id}: {r.status_code}")
                  except Exception as e:
                      print(f"Failed to send to {chat_id}: {e}")

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          free_channel = os.getenv("TELEGRAM_CHAT_ID")
          vip_channel = os.getenv("TELEGRAM_VIP_CHAT_ID")
          date = os.getenv("DATE")

          if not token:
              print("FATAL: TELEGRAM_BOT_TOKEN missing")
              raise SystemExit(1)
          if not free_channel:
              print("FATAL: TELEGRAM_CHAT_ID missing")
              raise SystemExit(1)

          free_report = read_file("telegram_daily.txt") or read_file("combined_free.txt") or f"⚠️ No predictions generated for {date}."
          vip_report = read_file("combined_vip.txt") or f"⚠️ VIP report unavailable for {date}."

          print(f"Free report length: {len(free_report)}")
          print(f"VIP report length: {len(vip_report)}")

          send(free_channel, free_report)
          if vip_channel:
              send(vip_channel, vip_report)
          PY
        env:
          DATE: ${{ steps.over-under.outputs.date }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}

  weekly-report:
    runs-on: self-hosted
    if: github.event.schedule == '0 3 * * 1' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'weekly' || github.event.inputs.mode == 'all'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Sync with latest main
        run: git pull --rebase origin main

      - name: Settle results and generate weekly report
        id: report
        continue-on-error: true
        run: |
          python fetch_results.py --days 10 || true
          python update_manual_results.py || true
          python fetch_results.py --days 10 || true
          python generate_weekly_report.py
          REPORT_FILE=$(ls -t weekly_report_*.txt 2>/dev/null | head -1)
          echo "file=$REPORT_FILE" >> "$GITHUB_OUTPUT"

      - name: Commit weekly report
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          shopt -s nullglob
          files=(weekly_report_*.txt weekly_report_*.json)
          if [ ${#files[@]} -gt 0 ]; then
            git add "${files[@]}"
          fi
          git add prediction_history.json manual_results.csv README.md
          if git diff --cached --quiet; then
            echo "No weekly report changes to commit."
          else
            git commit -m "Weekly performance report"
            git push origin main
          fi

      - name: Send weekly report to Telegram
        if: always()
        run: |
          python - <<'PY'
          import os
          import requests

          def send(chat_id, text):
              if not chat_id or not text:
                  return
              for chunk in (text[i:i + 3900] for i in range(0, len(text), 3900)):
                  requests.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data={"chat_id": chat_id, "text": chunk},
                      timeout=30,
                  )

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          report_file = os.getenv("REPORT_FILE")
          if not token or not report_file or not os.path.exists(report_file):
              print("Skipping Telegram weekly report.")
              raise SystemExit(0)
          with open(report_file, "r", encoding="utf-8") as f:
              report = f.read().strip()
          for chat_id in (os.getenv("TELEGRAM_CHAT_ID"), os.getenv("TELEGRAM_VIP_CHAT_ID")):
              send(chat_id, report)
          PY
        env:
          REPORT_FILE: ${{ steps.report.outputs.file }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}

  monthly-report:
    runs-on: self-hosted
    if: github.event.schedule == '0 3 1 * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'monthly' || github.event.inputs.mode == 'all'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Sync with latest main
        run: git pull --rebase origin main

      - name: Settle results and generate monthly report
        id: report
        continue-on-error: true
        run: |
          python fetch_results.py --days 35 || true
          python update_manual_results.py || true
          python fetch_results.py --days 35 || true
          python generate_monthly_report.py
          REPORT_FILE=$(ls -t monthly_report_*.txt 2>/dev/null | head -1)
          echo "file=$REPORT_FILE" >> "$GITHUB_OUTPUT"

      - name: Commit monthly report
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          shopt -s nullglob
          files=(monthly_report_*.txt monthly_report_*.json)
          if [ ${#files[@]} -gt 0 ]; then
            git add "${files[@]}"
          fi
          git add prediction_history.json manual_results.csv
          if git diff --cached --quiet; then
            echo "No monthly report changes to commit."
          else
            git commit -m "Monthly performance report"
            git push origin main
          fi

      - name: Send monthly report to Telegram
        if: always()
        run: |
          python - <<'PY'
          import os
          import requests

          def send(chat_id, text):
              if not chat_id or not text:
                  return
              for chunk in (text[i:i + 3900] for i in range(0, len(text), 3900)):
                  requests.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      data={"chat_id": chat_id, "text": chunk},
                      timeout=30,
                  )

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          report_file = os.getenv("REPORT_FILE")
          if not token or not report_file or not os.path.exists(report_file):
              print("Skipping Telegram monthly report.")
              raise SystemExit(0)
          with open(report_file, "r", encoding="utf-8") as f:
              report = f.read().strip()
          for chat_id in (os.getenv("TELEGRAM_CHAT_ID"), os.getenv("TELEGRAM_VIP_CHAT_ID")):
              send(chat_id, report)
          PY
        env:
          REPORT_FILE: ${{ steps.report.outputs.file }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
