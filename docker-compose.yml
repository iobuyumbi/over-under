version: '3.8'
services:
  over-under-pipeline:
    build: .
    container_name: over-under-pipeline
    volumes:
      - ./.env:/app/.env:ro
      - ./prediction_history.json:/app/prediction_history.json
      - ./manual_results.csv:/app/manual_results.csv
      - ./blacklist.json:/app/blacklist.json
      - ./curated.json:/app/curated.json
    environment:
      - TZ=Europe/London
    restart: unless-stopped
    # One-shot run (instead of cron):
    # command: python3 daily_runner.py
